# Self-contained NestQuant GLM-5.3 serve (OpenAI API on :8001).
#
# This is the resolved, single-file equivalent of the three-file overlay that serve_nq.sh used to chain
# ($HA/docker-compose.yaml : $HA/docker-compose.glm53-arvq.yaml : docker-compose.nq.yaml). It needs NO
# files outside this repo. Bring it up with ../../start.sh (repo root), which sets the path/key env vars
# and runs the one-off host prep. Every host path below is an env var with a default; override as needed.
#
# Required local artifacts (NOT shipped in this repo — see README "Serving"):
#   - the Docker image glm53-arvq-sm120 (SM120 vLLM fork; pull_policy: never)
#   - the GLM-5.3 base checkpoint at NQ_MODEL_DIR (under NQ_MODELS_ROOT)
#   - the NestQuant repack at NQ_REPACK_DIR, the predictor at NQ_PREDICTOR_DIR, liburing at NQ_LIBURING_DIR
# MoE layers present in the repack run the NestQuant SSD-streaming kernel; the rest keep the base experts.
services:
  glm53-nestquant:
    image: ${NQ_IMAGE:-glm53-arvq-sm120:fixes12-mtp-buffer-rng-20260917}
    pull_policy: never
    container_name: glm53-nestquant
    restart: unless-stopped
    ipc: host
    shm_size: "16g"
    security_opt:
      - seccomp=unconfined          # io_uring (the default docker seccomp profile blocks io_uring_setup)
    ports:
      - "0.0.0.0:8001:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 4
              capabilities: [gpu]
    environment:
      # --- serving identity / sizing (NestQuant overrides) ---
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      SERVED_NAME: ${NQ_SERVED_NAME:-glm-5.3-nq}
      MODEL_DIR: ${NQ_MODEL_DIR:-/data/models/jarrelscy/GLM-5.3-Vision-NVFP4-ARVQ-hybrid-pv-d4a105dc50dd}
      PARALLEL: ${PARALLEL:-tp4-1m-mtp}        # entrypoint preset: TP4 + DCP4 + MTP
      MAXLEN: ${NQ_MAXLEN:-131072}
      UTIL: ${NQ_UTIL:-0.88}
      MAX_NUM_SEQS: ${NQ_MAX_NUM_SEQS:-4}
      MAX_NUM_BATCHED_TOKENS: ${NQ_MNBT:-4096}
      NUM_SPEC: ${NUM_SPEC:-3}
      VLLM_SERVER_DEV_MODE: ${NQ_DEV_MODE:-0}
      CUDAGRAPH_MODE: FULL_AND_PIECEWISE
      VLLM_LOGGING_LEVEL: ${VLLM_LOGGING_LEVEL:-INFO}
      # --- LMCache: CPU-RAM tier only (no disk tier; it would compete with the SSD expert stream) ---
      ENABLE_LMCACHE: ${NQ_LMCACHE:-1}
      LMCACHE_LOCAL_CPU: 'True'
      LMCACHE_MAX_LOCAL_CPU_SIZE: ${NQ_LMCACHE_CPU_GB:-18}   # GB per TP rank (x4 -> ~72 GB pinned host RAM)
      LMCACHE_LOCAL_DISK: file:///lmcache/disk/unused
      LMCACHE_MAX_LOCAL_DISK_SIZE: '0'                       # 0 = no disk backend
      LMCACHE_CHUNK_SIZE: '256'
      LMCACHE_USE_GPU_CONNECTOR_V3: 'True'
      LMCACHE_PRE_CACHING_HASH_ALGORITHM: sha256_cbor
      LMCACHE_LOOKUP_SERVER_WORKER_IDS: 0,1,2,3
      PYTHONHASHSEED: '0'
      # --- NestQuant kernel wiring ---
      PYTHONPATH: /nq/sm120/serve
      NQ_HOME: /nq
      NQ_REPACK: /nqrepack
      NQ_BUILD: /nqbuild
      NQ_LGB_PATH: /nqlgb
      LIBURING: /data/Jarrel/liburing                        # container path (mount target below)
      CUDA_HOME: /opt/vllm/.venv/lib/python3.12/site-packages/nvidia/cu13
      NQ_LAYERS: ${NQ_LAYERS:-}                              # empty = every layer in the repack
      NQ_STREAM: ${NQ_STREAM:-1}
      NQ_SLOTS_PER_LAYER: ${NQ_SLOTS_PER_LAYER:-56}
      NQ_CAP_GBPS: ${NQ_CAP_GBPS:-0}                         # 0 = uncapped
      NQ_CHECK: ${NQ_CHECK:-0}
      CUDA_LAUNCH_BLOCKING: ${NQ_CLB:-0}
      NQ_DUMP: ${NQ_DUMP:-}
      NQ_HITS: ${NQ_HITS:-1}
      NQ_POLL_MS: ${NQ_POLL_MS:-4}
      NQ_ISSUE: ${NQ_ISSUE:-1}
      NQ_LEADER: ${NQ_LEADER:-1}
      NQ_SHADOW: ${NQ_SHADOW:-0}
      NQ_FAULT_READ_MS: ${NQ_FAULT_READ_MS:-}
      NQ_FAULT_FAIL_PPM: ${NQ_FAULT_FAIL_PPM:-}
      # --- expert predictor (ema | gbdt | joint/jF) ---
      NQ_PREDICTOR: ${NQ_PREDICTOR:-}                        # empty = image default
      NQ_JOINT_HM: ${NQ_JOINT_HM:-0.7}
      NQ_JOINT_GRAPH: ${NQ_JOINT_GRAPH:-0}
      NQ_JOINT_NET: ${NQ_JOINT_NET:-/nqpred/joint/jF.pt}
      NQ_JOINT_V2: ${NQ_JOINT_V2:-/nqpred/joint/v2_sal_tweedie1.5.txt}
      NQ_GBDT_MODE: ${NQ_GBDT_MODE:-sync}
      NQ_GBDT_THREADS: ${NQ_GBDT_THREADS:-4}
      NQ_GBDT_SCALE: ${NQ_GBDT_SCALE:-mps}
      NQ_GBDT_BAND: ${NQ_GBDT_BAND:-ema256}
      NQ_SESSION_RESTORE: ${NQ_SESSION_RESTORE:-1}
      NQ_DELTA_TABLE: /nqpred/delta_table.json
      # --- prefill path ---
      NQ_PF: ${NQ_PF:-1}
      NQ_PF_MIN: ${NQ_PF_MIN:-384}
      NQ_PF_ROWS: ${NQ_PF_ROWS:-8192}
      NQ_PF_G: ${NQ_PF_G:-16}
      NQ_PF_GEMM: ${NQ_PF_GEMM:-triton}
      NQ_PREFILL_ADAPT: ${NQ_PREFILL_ADAPT:-lookahead}
      NQ_LA_D: ${NQ_LA_D:-1}
      NQ_LA_BUDGET: ${NQ_LA_BUDGET:-45}
      NQ_PF_RANK: ${NQ_PF_RANK:-gate}
      NQ_LA_MEASURE: ${NQ_LA_MEASURE:-0}
      NQ_LA_GAMMA: ${NQ_LA_GAMMA:-1}
      NQ_LA_OUT: /dbg/la_stats.json
      # --- base GLM-5.3 ARVQ stack flags (baked-image behaviour; keep as-is) ---
      VLLM_ARVQ_CHUNK_TOKENS: '128'
      VLLM_ARVQ_GROUPED_PREFILL: '1'
      VLLM_ARVQ_COMPACT_PREFILL: '1'
      VLLM_SM120_COMPACT_WORKSPACE: '1'
      VLLM_MTP_INDEX_SHARE: ${VLLM_MTP_INDEX_SHARE:-1}
      VLLM_DSA_CANONICAL_TOPK: ${VLLM_DSA_CANONICAL_TOPK:-inkernel}
      GLM_MOE_LANE_ROWS: '1'
      GLM_NVFP4_LUT256: '1'
      NCCL_P2P_LEVEL: SYS
      DCP_BACKEND: ag_rs
      VLLM_ENABLE_PCIE_ALLREDUCE: '1'
      VLLM_PCIE_ALLREDUCE_BACKEND: b12x
      B12X_PCIE_TP4_REMOTE_PUSH: '1'
      B12X_PCIE_FUSED_THREADS: '512'
      B12X_PCIE_FUSED_CTAS_PER_ROW: '1'
      VLLM_PCIE_ONESHOT_ALLREDUCE_MAX_SIZE: '0'
      VLLM_PCIE_ONESHOT_FUSED_ADD_RMS_NORM_MAX_SIZE: '12288'
      VLLM_PCIE_TWOSHOT_ALLREDUCE_MAX_SIZE: 'off'
      VLLM_PCIE_DMA_MIN_BYTES: 24MB
      VLLM_PCIE_DMA_FP8: 'off'
      VLLM_GLM_PCIE_FUSED_AR_RMS: '1'
      VLLM_ENABLE_NVFP4_P4_O_PROJ: '1'
      VLLM_NVFP4_P4_MAX_TOKENS: '16'
      VLLM_NVFP4_P4_PAIRED: '1'
      VLLM_EXPERIMENT_DCP_BYTEPACK_OWNER: '1'
      VLLM_EXPERIMENT_DCP_BYTEPACK_OWNER_SHADOW: '0'
      VLLM_ARVQ_FUSED_GATE_PACK: '1'
      VLLM_ARVQ_FUSED_COLD_SCATTER: '1'
      VLLM_ARVQ_DIRECT_COLD_OUTPUT: '1'
      NCCL_ALGO: RING,TREE
      NCCL_BUFFSIZE: '1048576'
      NCCL_MAX_NCHANNELS: '4'
      NCCL_VERSION: 2.27.3-1
      VLLM_ARVQ_FUSED_ACTIVATION_PACK: '1'
      VLLM_ARVQ_FUSED_COLD_ACTIVATION: '1'
      VLLM_ARVQ_FUSED_COLD_GATHER: '1'
      VLLM_ARVQ_FUSED_ROUTE_SUM: '1'
      VLLM_ARVQ_PAIRED_HOT_PREFILL: '1'
      VLLM_ARVQ_SHARED_HOT_ACTIVATION: '1'
      VLLM_ARVQ_WIDE_HOT_PREFILL: '1'
      VLLM_EXPERIMENT_DCP_BYTEPACK: '1'
      VLLM_EXPERIMENT_DCP_BYTEPACK_SHADOW: '0'
      VLLM_GLM_COMM_COALESCE: '0'
      VLLM_GLM_COMM_OVERLAP: '1'
      VLLM_GLM_DCP_AG_RAW_TOPK: '1'
      VLLM_GLM_DCP_QUERY_SPLIT: '0'
      VLLM_GLM_DCP_QUERY_SPLIT_MIN_ROWS: '1024'
      VLLM_GLM_DCP_RS_STAGED: '1'
      VLLM_GLM_DCP_RS_VIEW: '1'
      VLLM_GLM_EMBED_GRAPH: '1'
      VLLM_GLM_IDX_FUSED_LOCALIZE: '1'
      VLLM_GLM_MM_MASK_REUSE: '1'
      VLLM_GLM_Q_BEFORE_ABSORB: '1'
      VLLM_GLM_RAW_KV_GATHER: '1'
      VLLM_GLM_SKIP_EMPTY_FILL: '1'
      VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: '256'
      VLLM_EXPERIMENT_C1_INDEXER_BUDGET: '0'
      VLLM_C8_SAMPLER_DEBUG_DIR: ''
      VLLM_FORCE_CUSTOM_ALLREDUCE: '0'
      AQLM_GEMV_PIPELINE: '1'
      VLLM_SM120_ROUTER_GEMM: '1'
      AQLM_GEMV_BF16IN: '1'
      AQLM_FUSED_COMBINE: '1'
      AQLM_GLUE_OPT: '1'
      AQLM_GEMV_ROWMAP: '1'
      AQLM_FUSED_SILU: '1'
      VLLM_DCP_A2A_EXACT: '0'
      LOCAL_ARGMAX: ''
      CUTE_DSL_ARCH: sm_120a
      TRITON_CACHE_DIR: /data/triton_cache
    volumes:
      # NestQuant repo + artifacts
      - ${NQ_REPO:-/data/Jarrel/nestquant}:/nq:ro
      - ${NQ_REPO:-/data/Jarrel/nestquant}/sm120/serve/overlay/nvfp4_arvq_hybrid.py:/opt/vllm/vllm/model_executor/layers/quantization/nvfp4_arvq_hybrid.py:ro
      - ${NQ_REPACK_DIR:-/home/jarrelscy/nq-p4rec/hf}:/nqrepack:ro
      - ${NQ_PREDICTOR_DIR:-/data/Jarrel/nq-serve/predictor}:/nqpred:ro
      - ${NQ_BUILD_DIR:-/data/Jarrel/nq-build-container}:/nqbuild
      - ${NQ_LGB_DIR:-/data/Jarrel/nq-dev/pylgb}:/nqlgb:ro
      - ${NQ_LIBURING_DIR:-/data/Jarrel/liburing}:/data/Jarrel/liburing:ro
      - ${NQ_DBG_DIR:-/data/Jarrel/nq-serve/dbg}:/dbg
      # base checkpoint + tokenizer/config
      - ${NQ_MODELS_ROOT:-/data/models}:/data/models:ro
      - ${HF_HOME_DIR:-/data/huggingface}:/data/huggingface:ro
      # caches + outputs (host paths default to this box; override for a fresh host)
      - ${NQ_VLLM_CACHE:-/data/Jarrel/nq-serve/vllm-cache}:/root/.cache/vllm
      - ${NQ_LMCACHE_DIR:-/data/lmcache/glm5.3-nq}:/lmcache/disk
      - ${NQ_TRITON_CACHE_DIR:-/data/triton_cache/glm5.3-arvq}:/data/triton_cache
      - ${NQ_FLASHINFER_CACHE:-/data/Jarrel/nq-serve/flashinfer-cache}:/root/.cache/flashinfer
      - ${NQ_TORCHEXT_CACHE:-/data/Jarrel/nq-serve/torch-extensions}:/root/.cache/torch_extensions
      - ${NQ_PROFILES_DIR:-/data/profiles/glm5.3-arvq}:/profiles
    command:
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":${NUM_SPEC:-3},"draft_sample_method":"probabilistic","rejection_sample_method":"standard"}'
      - --override-generation-config
      - '{"temperature":1.0,"top_p":0.95}'
      - --trust-remote-code
      - --reasoning-parser
      - glm47
      - --profiler-config.profiler=torch
      - --profiler-config.torch_profiler_dir=/profiles
      - --profiler-config.torch_profiler_with_stack=false
      - --enable-prefix-caching
      - --compilation-config
      - '{"mode":3,"cudagraph_mode":"FULL_AND_PIECEWISE","compile_sizes":[1],"cudagraph_capture_sizes":${ARVQ_CAPTURE_SIZES:-[1,2,4,8,16,32]}}'
