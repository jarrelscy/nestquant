# NestQuant experts on the GLM-5.3 ARVQ serving stack. Layered on the homeassistant compose files:
#   COMPOSE_FILE=docker-compose.yaml:docker-compose.glm53-arvq.yaml:<this file>   (serve_nq.sh sets it)
# Same image and non-expert weights as production; MoE layers present in NQ_REPACK run the NestQuant kernel with SSD
# P4 streaming, the others keep ARVQ.
# LMCache (NQ_LMCACHE, default 1): in-process LMCacheConnectorV1 (DCP-aware fork baked in the image), CPU RAM tier ONLY
# (NQ_LMCACHE_CPU_GB per TP rank, x4 ranks total pinned host RAM; no disk tier: it would compete with the SSD expert
# stream and has the known local_disk eviction crash). Own namespace /data/lmcache/glm5.3-nq, never the ARVQ caches
# (those hold KV computed with ARVQ experts). The ~1 GiB/GPU LMCache kv_buffer is not counted by vLLM's profiler;
# at NQ_UTIL 0.92 the 1M-prefill peak is 93.1 GB of 97.9 (~4.7 GiB free per GPU).
services:
  vllm-glm5.3-hybrid-1m:
    container_name: glm53-nestquant
    security_opt:
    - seccomp=unconfined          # io_uring (the default docker profile blocks io_uring_setup)
    environment:
      ENABLE_LMCACHE: ${NQ_LMCACHE:-1}
      LMCACHE_LOCAL_CPU: 'True'
      LMCACHE_MAX_LOCAL_CPU_SIZE: ${NQ_LMCACHE_CPU_GB:-18}   # GB per TP rank (4 ranks -> 72 GB pinned host RAM, ~1.3M tokens)
      LMCACHE_LOCAL_DISK: file:///lmcache/disk/unused
      LMCACHE_MAX_LOCAL_DISK_SIZE: '0'                      # 0 = no disk backend (storage_backend: needs size > 0)
      VLLM_SERVER_DEV_MODE: ${NQ_DEV_MODE:-0}               # 1 = /reset_prefix_cache etc. (gates only)
      SERVED_NAME: ${NQ_SERVED_NAME:-glm-5.3-nq}
      MAXLEN: ${NQ_MAXLEN:-131072}
      UTIL: ${NQ_UTIL:-0.88}
      MAX_NUM_SEQS: ${NQ_MAX_NUM_SEQS:-4}
      NUM_SPEC: ${NUM_SPEC:-3}
      PYTHONPATH: /nq/sm120/serve
      NQ_HOME: /nq
      NQ_REPACK: /nqrepack
      NQ_BUILD: /nqbuild
      NQ_LAYERS: ${NQ_LAYERS:-}
      NQ_STREAM: ${NQ_STREAM:-1}
      NQ_SLOTS_PER_LAYER: ${NQ_SLOTS_PER_LAYER:-56}
      NQ_CAP_GBPS: ${NQ_CAP_GBPS:-0}          # 0 = uncapped (drive ~11 GB/s + slot pool limit); else aggregate GB/s over the TP ranks
      NQ_CHECK: ${NQ_CHECK:-0}
      CUDA_LAUNCH_BLOCKING: ${NQ_CLB:-0}
      NQ_DUMP: ${NQ_DUMP:-}
      NQ_TFCAP: ${NQ_TFCAP:-}                 # nq-tfpred decode-trace capture dir (in container); empty = off
      NQ_HITS: ${NQ_HITS:-1}
      NQ_POLL_MS: ${NQ_POLL_MS:-4}
      NQ_ISSUE: ${NQ_ISSUE:-1}
      NQ_LEADER: ${NQ_LEADER:-1}
      NQ_SHADOW: ${NQ_SHADOW:-0}
      NQ_FAULT_READ_MS: ${NQ_FAULT_READ_MS:-}
      NQ_FAULT_FAIL_PPM: ${NQ_FAULT_FAIL_PPM:-}
      # nq-io I/O upgrades (sm120/serve/nq_vllm.py "nq-io" block); every default = the original serve
      NQ_IO_MODE: ${NQ_IO_MODE:-}                # '' | dual | split
      NQ_REPACK_ALT: /nqrepack1
      NQ_IO_SPLIT_RANKS: ${NQ_IO_SPLIT_RANKS:-2,3}
      NQ_IO_QD: ${NQ_IO_QD:-8}
      NQ_IO_QD_ALT: ${NQ_IO_QD_ALT:-}
      NQ_IO_NHOST: ${NQ_IO_NHOST:-}
      NQ_RAMTIER_GB: ${NQ_RAMTIER_GB:-0}
      NQ_RAMTIER_LIST: ${NQ_RAMTIER_LIST:-/nq/streaming/results/ramtier_jf.json}
      NQ_RAMTIER_MINAVAIL_GB: ${NQ_RAMTIER_MINAVAIL_GB:-30}
      NQ_FOLLOW_COALESCE: ${NQ_FOLLOW_COALESCE:-0}
      NQ_FOLLOW_CHECK: ${NQ_FOLLOW_CHECK:-0}
      NQ_HOSTLOOP: ${NQ_HOSTLOOP:-py}
      NQ_SCHED: ${NQ_SCHED:-}
      NQ_RANK_SHARE: ${NQ_RANK_SHARE:-0}
      NQ_IOSTATS: ${NQ_IOSTATS:-0}
      NQ_PREDICTOR: ${NQ_PREDICTOR:-}
      NQ_JOINT_HM: ${NQ_JOINT_HM:-0.7}         # jF joint predictor (NQ_PREDICTOR=joint): resident hysteresis
      NQ_JOINT_GRAPH: ${NQ_JOINT_GRAPH:-0}     # 1 = CUDA-graph the scoring core (per-instance capture); 0 = eager
      NQ_JOINT_NET: ${NQ_JOINT_NET:-/nqpred/joint/jF.pt}
      NQ_JOINT_V2: ${NQ_JOINT_V2:-/nqpred/joint/v2_sal_tweedie1.5.txt}
      NQ_GBDT_MODE: ${NQ_GBDT_MODE:-sync}
      NQ_GBDT_THREADS: ${NQ_GBDT_THREADS:-4}
      NQ_GBDT_SCALE: ${NQ_GBDT_SCALE:-mps}
      NQ_GBDT_BAND: ${NQ_GBDT_BAND:-ema256}
      NQ_SESSION_RESTORE: ${NQ_SESSION_RESTORE:-1}   # per-session floating-set restore (nq_session.py); in-boot toggle /dev/shm/nq_sr_ctl
      NQ_PF: ${NQ_PF:-1}                      # prefill path (moe.MoELayer.prefill) for >= NQ_PF_MIN tokens
      NQ_PF_MIN: ${NQ_PF_MIN:-384}
      NQ_PF_ROWS: ${NQ_PF_ROWS:-8192}
      NQ_PF_G: ${NQ_PF_G:-16}
      NQ_PF_GEMM: ${NQ_PF_GEMM:-triton}
      MAX_NUM_BATCHED_TOKENS: ${NQ_MNBT:-4096}
      NQ_PREFILL_ADAPT: ${NQ_PREFILL_ADAPT:-lookahead}   # 0 | lookahead | chunk (nq_lookahead.py); gated ON 2026-09-29
      NQ_LA_D: ${NQ_LA_D:-1}
      NQ_LA_BUDGET: ${NQ_LA_BUDGET:-45}
      NQ_PF_RANK: ${NQ_PF_RANK:-gate}          # gate | salience | count
      NQ_LA_MEASURE: ${NQ_LA_MEASURE:-0}
      NQ_PREFILL_BORROW: ${NQ_PREFILL_BORROW:-0}   # nq-prefill: free KV blocks -> extra expert slots during long prefills (nq_pb*.py)
      NQ_PREFILL_SLOTS: ${NQ_PREFILL_SLOTS:-155}   # floating experts per layer planned while borrowed
      NQ_PREFILL_KV_OFFLOAD: ${NQ_PREFILL_KV_OFFLOAD:-0}   # phase 2 (needs NQ_PREFILL_BORROW=1): USED KV of some MLA layers to pinned host during long prefills, streamed per layer
      NQ_PB_KV_HOST_GB: ${NQ_PB_KV_HOST_GB:-8}   # phase 2 pinned host cap per rank (sized from MemAvailable at each borrow, all ranks)
      NQ_PB_RAM_FLOOR_GB: ${NQ_PB_RAM_FLOOR_GB:-38}   # phase 2 never borrows / releases mid-borrow below this MemAvailable
      NQ_PB_MIN_NEW: ${NQ_PB_MIN_NEW:-8192}        # borrow only for prefills with >= this many new (uncached) tokens
      NQ_PB_MARGIN: ${NQ_PB_MARGIN:-16}            # KV blocks always left free beyond the request's own prompt
      NQ_LA_GAMMA: ${NQ_LA_GAMMA:-1}
      NQ_DELTA_TABLE: /nqpred/delta_table.json
      NQ_LA_OUT: /dbg/la_stats.json
      NQ_LGB_PATH: /nqlgb
      LIBURING: /data/Jarrel/liburing
      CUDA_HOME: /opt/vllm/.venv/lib/python3.12/site-packages/nvidia/cu13
      VLLM_LOGGING_LEVEL: ${VLLM_LOGGING_LEVEL:-INFO}
    volumes:
    - ${NQ_REPO:-/data/Jarrel/nestquant}:/nq:ro
    - ${NQ_REPACK_DIR:-/home/jarrelscy/nq-p4rec/hf}:/nqrepack:ro
    - ${NQ_BUILD_DIR:-/data/Jarrel/nq-build-container}:/nqbuild
    - ${NQ_REPACK_ALT_DIR:-/data/Jarrel/nq-p4rec-nvme1}:/nqrepack1:ro   # nq-io: copy of the record files on nvme1 (/data)
    - /data/Jarrel/liburing:/data/Jarrel/liburing:ro
    - /data/Jarrel/nq-serve/vllm-cache:/root/.cache/vllm
    - /data/Jarrel/nq-serve/dbg:/dbg
    - /rawdata/Jarrel/nq-tfpred/traces:/tfcap
    - /data/Jarrel/nq-serve/predictor:/nqpred:ro
    - /data/lmcache/glm5.3-nq:/lmcache/disk                 # replaces the ARVQ /lmcache/disk mount (unused while disk size is 0)
    - ${NQ_LGB_DIR:-/data/Jarrel/nq-dev/pylgb}:/nqlgb:ro     # lightgbm + narwhals + scipy for NQ_PREDICTOR=gbdt (serve_nq.sh installs it)
    - ${NQ_REPO:-/data/Jarrel/nestquant}/sm120/serve/overlay/nvfp4_arvq_hybrid.py:/opt/vllm/vllm/model_executor/layers/quantization/nvfp4_arvq_hybrid.py:ro
